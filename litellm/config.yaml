# Gateway con PostgreSQL externo (Supabase), panel y metricas persistentes.
# Estos modelos y fallbacks se gestionan en Git. El panel permite consultarlos;
# los modelos definidos aqui no se editan desde el panel.
model_list:
  - model_name: mar-chat
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: mar-clasificador
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: mar-respaldo
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  # Un intento por modelo; evita multiplicar los reintentos del cliente n8n.
  num_retries: 0
  timeout: 20
  fallbacks:
    - mar-chat: [mar-respaldo]
    - mar-clasificador: [mar-respaldo]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 5
  store_model_in_db: true
  disable_spend_logs: false
  store_prompts_in_spend_logs: false

litellm_settings:
  # Mantiene metadatos tecnicos sin registrar mensajes/respuestas en callbacks.
  turn_off_message_logging: true
